name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # HACS downloads `filename` from the release assets for plugin
      # repositories, so the built bundle has to be attached here rather than
      # committed to the branch.
      - name: Attach the bundle to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/semaphore.js
          generate_release_notes: true
