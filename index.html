<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sémaphore — éditeur de plan</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
      }
      /* The editor owns the window: it sizes its canvas from the space it is
         given, so the page must never be the thing that scrolls. */
      body {
        overflow: hidden;
        background: #0c2233;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/studio/main.ts"></script>
  </body>
</html>
